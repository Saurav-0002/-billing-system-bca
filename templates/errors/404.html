<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>404 — Page Not Found</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=DM+Sans&display=swap" rel="stylesheet"/>
</head>
<body class="min-h-screen bg-[#0D1B3E] flex items-center justify-center" style="font-family:'DM Sans',sans-serif">
  <div class="text-center px-6">
    <p class="text-[#00B4D8] text-8xl font-extrabold" style="font-family:Sora,sans-serif">404</p>
    <h1 class="text-white text-2xl font-bold mt-3 mb-2">Page Not Found</h1>
    <p class="text-white/40 text-sm mb-8">The page you're looking for doesn't exist.</p>
    <a href="/" class="px-6 py-3 rounded-xl bg-[#00B4D8] text-[#0D1B3E] font-bold text-sm hover:bg-[#0096B7] transition-colors">
      Go Home
    </a>
  </div>
</body>
</html>
